<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta Viva — Ficha de Pré-Atendimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600&family=Cinzel:wght@500;700&family=Allura&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F7F2E8; --cartao:#FFFDF8; --tinta:#1E1B16; --suave:#6B645A;
  --destaque:#C9962B; --apoio:#5E6B3A; --linha:#E2D9C6; --erro:#B3261E;
  --raio:14px; --fonteTitulo:Lora,serif; --suaveFundo:#FBF3DF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.topo{padding:18px 16px 0;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.selo{width:42px;height:42px;border-radius:50%;background:var(--tinta);color:var(--papel);display:grid;place-items:center;font:700 18px Lora,serif;flex:none}
.topo .nome{font:600 15px Lora,serif;line-height:1.2}
.topo .oab{font-size:12px;color:var(--suave)}
.progresso{max-width:640px;margin:14px auto 0;padding:0 16px}
.trilho{height:6px;background:var(--linha);border-radius:99px;overflow:hidden}
.trilho span{display:block;height:100%;background:var(--destaque);width:0;transition:width .35s ease}
.passo-txt{font-size:12px;color:var(--suave);margin-top:6px;letter-spacing:.02em}
main{max-width:640px;margin:0 auto;padding:16px 16px 120px}
.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);padding:22px 18px;box-shadow:0 1px 0 rgba(0,0,0,.03);animation:entra .3s ease}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font:700 28px/1.15 var(--fonteTitulo);margin:0 0 10px}
h2{font:700 22px/1.2 var(--fonteTitulo);margin:0 0 6px}
/* ── visual opcional: fundo, logo e capa ── */
body.com-fundo::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--imgFundo) center/cover no-repeat}
body.com-fundo .cartao{background:rgba(255,253,250,.94);box-shadow:0 10px 30px -18px rgba(30,27,22,.35);backdrop-filter:blur(2px)}
body.com-fundo .barra{background:linear-gradient(to top,rgba(246,243,238,.97) 65%,rgba(246,243,238,0))}
.topo .logo{height:84px;width:auto;display:block}
.topo.com-logo{flex-direction:column;align-items:center;gap:4px;text-align:center}
.topo.com-logo .nome{font:600 14px/1.3 Lora,serif;letter-spacing:.04em;margin-top:4px;text-wrap:balance}
.capa{position:relative;margin:-22px -18px 20px;height:300px;border-radius:var(--raio) var(--raio) 0 0;overflow:hidden;background:var(--tinta)}
.capa img{width:100%;height:100%;object-fit:cover;display:block}
.capa .frase{position:absolute;left:22px;right:22px;top:26px;font:400 44px/1.02 Allura,cursive;color:var(--tinta);text-shadow:0 0 18px rgba(255,255,255,.85),0 0 4px rgba(255,255,255,.6)}
.capa .palavras{position:absolute;right:20px;bottom:18px;text-align:right;font:500 11px/1.7 Cinzel,serif;letter-spacing:.18em;color:#fff}
.capa .palavras:after{content:"";display:block;width:34px;height:2px;background:var(--destaque);margin:6px 0 0 auto}
.capa.mini{height:170px}
.capa.mini .frase{font-size:34px;top:18px}
.lead{color:var(--suave);margin:0 0 18px}
.pontos{list-style:none;padding:0;margin:0 0 18px}
.pontos li{padding:8px 0 8px 28px;position:relative;border-bottom:1px dashed var(--linha)}
.pontos li:before{content:"✓";position:absolute;left:4px;color:var(--apoio);font-weight:700}
.aviso{background:var(--suaveFundo);border-left:4px solid var(--destaque);padding:12px 14px;border-radius:8px;font-size:14px}
.alerta{background:#FCEBEA;border-left:4px solid var(--erro);padding:12px 14px;border-radius:8px;font-size:14px;margin-top:14px}
.campo{margin:18px 0 0}
.campo label.rot{display:block;font-weight:600;margin-bottom:6px}
.campo .obr{color:var(--erro)}
.campo .ajuda{font-size:13px;color:var(--suave);margin:-2px 0 8px}
input[type=text],input[type=tel],input[type=email],input[type=number],textarea{
  width:100%;font:inherit;color:inherit;background:#fff;border:1.5px solid var(--linha);border-radius:10px;padding:12px 13px;outline:none;transition:border-color .15s}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{border-color:var(--destaque)}
.campo.invalido input,.campo.invalido textarea,.campo.invalido .pilulas{border-color:var(--erro)}
.msg-erro{display:none;color:var(--erro);font-size:13px;margin-top:6px}
.campo.invalido .msg-erro{display:block}
.pilulas{display:flex;flex-wrap:wrap;gap:8px;border:1.5px solid transparent;border-radius:12px}
.pilula{position:relative}
.pilula input{position:absolute;opacity:0;pointer-events:none}
.pilula span{display:block;padding:10px 14px;border:1.5px solid var(--linha);border-radius:99px;background:#fff;cursor:pointer;font-size:15px;transition:all .15s}
.pilula input:checked+span{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.pilula input:focus-visible+span{outline:2px solid var(--destaque);outline-offset:2px}
.grupo-tit{font:600 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);margin:20px 0 8px}
.areas{display:grid;gap:10px}
.area{position:relative}
.area input{position:absolute;opacity:0;pointer-events:none}
.area > span{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--linha);border-radius:12px;background:#fff;cursor:pointer;transition:all .15s}
.area .ic{font-size:22px;width:30px;text-align:center}
.area input:checked+span{border-color:var(--destaque);background:var(--suaveFundo);box-shadow:inset 0 0 0 1px var(--destaque)}
.area input:focus-visible+span{outline:2px solid var(--destaque);outline-offset:2px}
.checks{display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--linha);border-radius:10px;background:#fff;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--apoio);flex:none}
.termo{font-size:14px;background:#fff;border:1px solid var(--linha);border-radius:10px;padding:14px;max-height:260px;overflow:auto}
.termo p{margin:0 0 10px}
.resumo dl{margin:0}
.resumo .bloco{border-top:1px solid var(--linha);padding:12px 0}
.resumo .bloco:first-child{border-top:0}
.resumo h3{font:600 13px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--suave);margin:0 0 6px;display:flex;justify-content:space-between}
.resumo h3 button{font:500 13px Inter,sans-serif;background:none;border:0;color:var(--apoio);text-decoration:underline;cursor:pointer;padding:0}
.resumo dt{font-size:13px;color:var(--suave)}
.resumo dd{margin:0 0 8px;font-weight:500;word-break:break-word}
.protocolo{font:700 26px "Courier New",monospace;letter-spacing:.06em;background:var(--tinta);color:var(--papel);padding:12px 16px;border-radius:10px;display:inline-block;margin:10px 0 16px}
.barra{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--papel) 70%,transparent);padding:18px 16px calc(14px + env(safe-area-inset-bottom))}
.barra .dentro{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{font:600 16px Inter,sans-serif;border-radius:12px;padding:14px 18px;border:1.5px solid var(--tinta);cursor:pointer;transition:transform .1s, opacity .15s}
.btn:active{transform:scale(.98)}
.btn.prim{background:var(--tinta);color:var(--papel);flex:1}
.btn.sec{background:transparent;color:var(--tinta)}
.btn.zap{background:#1F8A4C;border-color:#1F8A4C;color:#fff;display:block;text-align:center;text-decoration:none;width:100%}
.btn[disabled]{opacity:.5;cursor:wait}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.rodape{text-align:center;font-size:12px;color:var(--suave);margin-top:18px}
.demo{font-size:13px;color:var(--suave);margin-top:14px}
@media (min-width:560px){.areas{grid-template-columns:1fr 1fr}.cartao{padding:30px 28px}h1{font-size:32px}.capa{margin:-30px -28px 24px;height:340px}.capa .frase{font-size:52px}}
/* ── microfone ── */
.com-mic{position:relative}
.com-mic input{padding-right:54px}
.com-mic textarea{padding-bottom:54px}
.mic{position:absolute;right:7px;width:42px;height:42px;border-radius:50%;border:0;background:var(--tinta);color:var(--destaque);display:grid;place-items:center;cursor:pointer;transition:transform .1s,background .15s}
.com-mic input+.mic{top:50%;transform:translateY(-50%);width:36px;height:36px}
.com-mic textarea+.mic{bottom:9px}
.mic svg{width:20px;height:20px}
.mic:active{transform:scale(.94)}
.com-mic input+.mic:active{transform:translateY(-50%) scale(.94)}
.mic.gravando{background:#B3261E;color:#fff;animation:pulsa 1.2s ease-in-out infinite}
@keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(179,38,30,.45)}70%{box-shadow:0 0 0 12px rgba(179,38,30,0)}100%{box-shadow:0 0 0 0 rgba(179,38,30,0)}}
.mic-status{display:none;font-size:13px;color:#B3261E;margin-top:6px;font-weight:500}
.mic-status.on{display:block}
.mic-status.info{color:var(--suave);font-weight:400}
.dica-mic{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--suave);background:var(--suaveFundo);border-radius:8px;padding:8px 10px;margin:0 0 4px}
.dica-mic svg{width:16px;height:16px;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

      ],

        {id:"plano", label:"Qual é o plano?", tipo:"texto", obrigatoria:true},
        {id:"urgente", label:"Há risco à saúde se esperar?", tipo:"opcoes", obrigatoria:true, opcoes:["Sim, é urgente","Não"], urgencia:"Sim, é urgente"}
      ],

<header class="topo" id="topo"></header>
<div class="progresso" id="progresso" hidden>
  <div class="trilho"><span id="trilho"></span></div>
  <div class="passo-txt" id="passoTxt"></div>
</div>
<main><div id="app" aria-live="polite"></div><p class="rodape" id="rodape"></p></main>
<div class="barra"><div class="dentro" id="barra"></div></div>

<script>
(function(){
"use strict";

const ETAPAS = ["boas","id","area","perguntas","docs","lgpd","revisao","fim"];
const ROTULOS = {id:"Seus dados",area:"Assunto",perguntas:"Detalhes",docs:"Documentos",lgpd:"Privacidade",revisao:"Revisão"};
const CHAVE = "consultaviva_rascunho";

let E = novoEstado();
function novoEstado(){
  return {etapa:0, dados:{nome:"",whatsapp:"",email:"",cidade:"",origem:""},
          area:"", respostas:{}, docs:[], relato:"", consent:false, consentSaude:false,
          protocolo:"", enviado:false, hp:""};
}

// ── utilidades ──────────────────────────────────────────────
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const area = () => CONFIG.areas.find(a => a.id === E.area);
const sensivel = () => !!(area() && area().sensivel);
// o rascunho expira para não deixar dados (inclusive de saúde) num aparelho compartilhado
const VALIDADE = (CONFIG.rascunhoHoras || 24) * 3600 * 1000;
function salvar(){ try{ localStorage.setItem(CHAVE, JSON.stringify(Object.assign({}, E, {_salvoEm:Date.now()}))); }catch(e){} }
function carregar(){ try{ const s = localStorage.getItem(CHAVE); if(s){ const o = JSON.parse(s); if(!o || !o._salvoEm || Date.now() - o._salvoEm > VALIDADE){ limpar(); return; } delete o._salvoEm; if(!o.enviado) E = Object.assign(novoEstado(), o); } }catch(e){} }
function limpar(){ try{ localStorage.removeItem(CHAVE); }catch(e){} }
function gerarProtocolo(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return "CV-" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + "-" + Math.random().toString(36).slice(2,6).toUpperCase();
}
function soDigitos(s){ return String(s||"").replace(/\D/g,""); }
function mascaraTel(v){
  const d = soDigitos(v).slice(0,11);
  if(d.length <= 2) return d;
  if(d.length <= 7) return "(" + d.slice(0,2) + ") " + d.slice(2);
  return "(" + d.slice(0,2) + ") " + d.slice(2,7) + "-" + d.slice(7);
}

// ── componentes ─────────────────────────────────────────────
// ── microfone: ditado por voz (Web Speech API) ──────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC = CONFIG.microfone !== false && !!SR;
const ANDROID = /Android/i.test(navigator.userAgent);
const ICONE_MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/></svg>';
let rec = null, micBtn = null;
function micStatus(btn, txt, info){
  const st = btn.closest(".campo").querySelector(".mic-status");
  if(!st) return;
  st.textContent = txt || "";
  st.classList.toggle("on", !!txt);
  st.classList.toggle("info", !!info);
}
function pararMic(){ if(rec){ try{ rec.stop(); }catch(e){} } }
function iniciarMic(btn){
  if(rec){ const mesmo = (micBtn === btn); pararMic(); if(mesmo) return; }
  const campo = btn.parentElement.querySelector("input,textarea");
  const base = campo.value.trim() ? campo.value.replace(/\s*$/, " ") : "";
  const r = new SR();
  r.lang = "pt-BR";
  r.interimResults = true;
  r.continuous = !ANDROID;          // no Android o modo contínuo repete palavras
  let falou = false;
  r.onresult = ev => {
    let txt = "";
    for(let i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
    txt = txt.trim();
    if(!base && txt) txt = txt.charAt(0).toUpperCase() + txt.slice(1);
    campo.value = base + txt;
    falou = true;
    campo.closest(".campo").classList.remove("invalido");
  };
  r.onerror = ev => {
    if(ev.error === "not-allowed" || ev.error === "service-not-allowed")
      micStatus(btn, "Permita o uso do microfone no navegador para ditar.", false);
    else if(ev.error === "no-speech")
      micStatus(btn, "Não ouvi nada. Toque no microfone e fale de novo.", true);
    else if(ev.error === "network")
      micStatus(btn, "Sem internet para transcrever. Você pode digitar.", false);
  };
  r.onend = () => {
    btn.classList.remove("gravando");
    btn.setAttribute("aria-label", "Ditar por voz");
    if(falou) micStatus(btn, "Pronto. Confira o texto e corrija se precisar.", true);
    if(rec === r){ rec = null; micBtn = null; }
  };
  try{ r.start(); }catch(e){ micStatus(btn, "Não foi possível abrir o microfone.", false); return; }
  rec = r; micBtn = btn;
  btn.classList.add("gravando");
  btn.setAttribute("aria-label", "Parar de ditar");
  micStatus(btn, "Ouvindo… fale com calma. Toque de novo para parar.", false);
}

function campo(q, valor){
  const id = "q_" + q.id;
  const obr = q.obrigatoria ? ' <span class="obr" aria-hidden="true">*</span>' : "";
  const ajuda = q.ajuda ? `<p class="ajuda">${esc(q.ajuda)}</p>` : "";
  let ctrl = "";
  if(q.tipo === "opcoes"){
    ctrl = `<div class="pilulas" role="radiogroup" aria-labelledby="${id}_r">` +
      q.opcoes.map(o => `<label class="pilula"><input type="radio" name="${id}" value="${esc(o)}" ${valor===o?"checked":""}><span>${esc(o)}</span></label>`).join("") +
      `</div>`;
    return `<div class="campo" data-q="${esc(q.id)}" data-obr="${q.obrigatoria?1:0}"><label class="rot" id="${id}_r">${esc(q.label)}${obr}</label>${ajuda}${ctrl}<div class="msg-erro">Escolha uma opção.</div></div>`;
  }
  if(q.tipo === "longo"){
    ctrl = `<textarea id="${id}" name="${id}">${esc(valor)}</textarea>`;
  } else {
    const t = q.tipo === "numero" ? 'type="number" inputmode="numeric" min="0"' : 'type="text"';
    ctrl = `<input ${t} id="${id}" name="${id}" value="${esc(valor)}">`;
  }
  let status = "";
  if(MIC && q.tipo !== "numero"){
    ctrl = `<div class="com-mic">${ctrl}<button type="button" class="mic" aria-label="Ditar por voz" title="Ditar por voz">${ICONE_MIC}</button></div>`;
    status = `<div class="mic-status" aria-live="polite"></div>`;
  }
  return `<div class="campo" data-q="${esc(q.id)}" data-obr="${q.obrigatoria?1:0}"><label class="rot" for="${id}">${esc(q.label)}${obr}</label>${ajuda}${ctrl}${status}<div class="msg-erro">Preencha este campo.</div></div>`;
}
function lerCampo(el){
  const r = el.querySelector("input[type=radio]:checked");
  if(el.querySelector("input[type=radio]")) return r ? r.value : "";
  const i = el.querySelector("input,textarea");
  return i ? i.value.trim() : "";
}
function validar(container){
  let ok = true, primeiro = null;
  container.querySelectorAll(".campo").forEach(el => {
    const v = lerCampo(el);
    let bad = el.dataset.obr === "1" && !v;
    if(el.dataset.valida === "tel" && v && soDigitos(v).length < 10) bad = true;
    if(el.dataset.valida === "email" && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) bad = true;
    el.classList.toggle("invalido", bad);
    if(bad){ ok = false; if(!primeiro) primeiro = el; }
  });
  if(primeiro){ primeiro.scrollIntoView({behavior:"smooth", block:"center"}); const f = primeiro.querySelector("input,textarea"); if(f) f.focus({preventScroll:true}); }
  return ok;
}

function capa(mini){
  const v = CONFIG.visual || {};
  if(!v.capa) return "";
  const frase = v.frase ? `<div class="frase">${esc(v.frase)}</div>` : "";
  const pal = (!mini && v.palavras && v.palavras.length) ? `<div class="palavras">${v.palavras.map(esc).join("<br>")}</div>` : "";
  return `<div class="capa${mini?" mini":""}"><img src="${esc(v.capa)}" alt="">${frase}${pal}</div>`;
}

// ── telas ───────────────────────────────────────────────────
const T = {
  boas(){
    return `<div class="cartao">${capa(false)}
      <h1>${esc(CONFIG.titulo)}</h1>
      <p class="lead">${esc(CONFIG.subtitulo)}</p>
      <ul class="pontos">
        <li>Leva cerca de 5 minutos</li>
        <li>Você pode voltar e corrigir antes de enviar</li>
        <li>Suas informações ficam protegidas pelo sigilo profissional</li>
      </ul>
      <div class="aviso">Esta ficha é uma <strong>pré-triagem</strong>. Ela não é consulta jurídica e não garante contratação nem resultado. O seu caso será analisado por ${esc(CONFIG.advogado)}.</div>
    </div>`;
  },
  id(){
    const d = E.dados;
    return `<div class="cartao" id="form">
      <h2>Seus dados</h2><p class="lead">Para sabermos com quem estamos falando.</p>
      <div class="campo" data-q="nome" data-obr="1"><label class="rot" for="f_nome">Nome completo <span class="obr">*</span></label><input type="text" id="f_nome" autocomplete="name" value="${esc(d.nome)}"><div class="msg-erro">Informe seu nome.</div></div>
      <div class="campo" data-q="whatsapp" data-obr="1" data-valida="tel"><label class="rot" for="f_zap">WhatsApp <span class="obr">*</span></label><input type="tel" id="f_zap" inputmode="tel" autocomplete="tel" placeholder="(69) 99999-9999" value="${esc(d.whatsapp)}"><div class="msg-erro">Informe um número com DDD.</div></div>
      <div class="campo" data-q="email" data-obr="0" data-valida="email"><label class="rot" for="f_mail">E-mail</label><input type="email" id="f_mail" autocomplete="email" value="${esc(d.email)}"><div class="msg-erro">E-mail inválido.</div></div>
      <div class="campo" data-q="cidade" data-obr="1"><label class="rot" for="f_cid">Cidade e estado <span class="obr">*</span></label><input type="text" id="f_cid" placeholder="Ex.: Porto Velho/RO" value="${esc(d.cidade)}"><div class="msg-erro">Informe sua cidade.</div></div>
      ${campo({id:"origem", label:"Como conheceu o escritório?", tipo:"opcoes", opcoes:["Indicação","Instagram","Google","Já sou cliente","Outro"]}, d.origem)}
      <div class="hp" aria-hidden="true"><label>Não preencha<input type="text" id="f_hp" tabindex="-1" autocomplete="off" value=""></label></div>
    </div>`;
  },
  area(){
    const grupos = [];
    CONFIG.areas.forEach(a => { if(!grupos.includes(a.grupo)) grupos.push(a.grupo); });
    return `<div class="cartao" id="form">
      <h2>Qual é o assunto?</h2><p class="lead">Escolha a opção mais próxima do seu caso.</p>
      <div class="campo" data-q="area" data-obr="1">` +
      grupos.map(g => `<div class="grupo-tit">${esc(g)}</div><div class="areas">` +
        CONFIG.areas.filter(a => a.grupo === g).map(a =>
          `<label class="area"><input type="radio" name="area" value="${esc(a.id)}" ${E.area===a.id?"checked":""}><span><span class="ic" aria-hidden="true">${a.icone||"•"}</span>${esc(a.nome)}</span></label>`
        ).join("") + `</div>`).join("") +
      `<div class="msg-erro">Escolha um assunto.</div></div></div>`;
  },
  perguntas(){
    const a = area();
    const qs = a.perguntas.map(q => campo(q, E.respostas[q.id] || "")).join("");
    return `<div class="cartao" id="form">
      <h2>${esc(a.nome)}</h2><p class="lead">Responda o que souber. O que não souber, pode deixar em branco.</p>
      ${MIC ? `<p class="dica-mic">${ICONE_MIC}<span>Prefere falar? Toque no microfone ao lado do campo e conte com as suas palavras.</span></p>` : ""}
      ${qs}
      ${campo({id:"__relato", label:"Quer contar mais alguma coisa?", tipo:"longo", ajuda:"Escreva com as suas palavras. Não precisa de termos jurídicos."}, E.relato)}
    </div>`;
  },
  docs(){
    const lista = (area().documentos || []);
    return `<div class="cartao" id="form">
      <h2>Documentos</h2><p class="lead">Marque o que você <strong>já tem em mãos</strong>. Não precisa enviar agora.</p>
      ${lista.length ? `<div class="checks">` + lista.map((d,i) =>
        `<label class="check"><input type="checkbox" value="${esc(d)}" ${E.docs.includes(d)?"checked":""}><span>${esc(d)}</span></label>`).join("") + `</div>`
        : `<p class="lead">Na conversa, vamos indicar quais documentos serão necessários.</p>`}
    </div>`;
  },
  lgpd(){
    return `<div class="cartao" id="form">
      <h2>Privacidade</h2><p class="lead">Leia com calma. É rápido.</p>
      <div class="termo" tabindex="0">
        <p><strong>Quem trata seus dados:</strong> ${esc(CONFIG.escritorio)}${CONFIG.endereco ? ", " + esc(CONFIG.endereco) : ""}.</p>
        <p><strong>Para quê:</strong> exclusivamente para analisar o seu caso e entrar em contato sobre ele. Seus dados não são vendidos nem usados para propaganda.</p>
        <p><strong>Por quanto tempo:</strong> ${esc(CONFIG.retencao)}. Se houver contratação, pelo tempo necessário à defesa dos seus interesses e às obrigações legais.</p>
        <p><strong>Sigilo:</strong> as informações ficam protegidas pelo sigilo profissional da advocacia.</p>
        ${CONFIG.endpoint ? "" : `<p><strong>Como a ficha é enviada:</strong> no final, o WhatsApp abre com as suas respostas já escritas para o número do escritório. Nada é enviado sem você tocar em enviar.</p>`}
        ${MIC ? `<p><strong>Se você usou o microfone:</strong> a sua fala foi convertida em texto pelo serviço de voz do próprio navegador (Google ou Apple). Só o texto é enviado ao escritório.</p>` : ""}
        <p><strong>Seus direitos:</strong> você pode pedir acesso, correção ou exclusão dos seus dados a qualquer momento pelo e-mail ${esc(CONFIG.encarregado)} (Lei 13.709/2018, art. 18).</p>
      </div>
      <div class="campo" data-q="consent" data-obr="1"><label class="check"><input type="checkbox" id="c1" ${E.consent?"checked":""}><span>Li e autorizo o uso dos meus dados para a análise do meu caso.</span></label><div class="msg-erro">É preciso autorizar para continuar.</div></div>
      ${sensivel() ? `<div class="campo" data-q="consentSaude" data-obr="1"><label class="check"><input type="checkbox" id="c2" ${E.consentSaude?"checked":""}><span>Autorizo, de forma específica, o uso das <strong>informações de saúde</strong> que informei, somente para esta análise (Lei 13.709/2018, art. 11).</span></label><div class="msg-erro">Esta autorização é necessária para analisarmos casos que envolvem saúde.</div></div>` : ""}
    </div>`;
  },
  revisao(){
    const a = area(), d = E.dados;
    const linha = (k,v) => v ? `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>` : "";
    return `<div class="cartao resumo">
      <h2>Confira antes de enviar</h2><p class="lead">Se algo estiver errado, toque em "corrigir".</p>
      <div class="bloco"><h3>Seus dados <button data-ir="1">corrigir</button></h3><dl>
        ${linha("Nome",d.nome)}${linha("WhatsApp",d.whatsapp)}${linha("E-mail",d.email)}${linha("Cidade",d.cidade)}${linha("Como conheceu",d.origem)}</dl></div>
      <div class="bloco"><h3>Assunto <button data-ir="2">corrigir</button></h3><dl>${linha("Área",a.nome)}</dl></div>
      <div class="bloco"><h3>Detalhes <button data-ir="3">corrigir</button></h3><dl>
        ${a.perguntas.map(q => linha(q.label, E.respostas[q.id])).join("")}${linha("Relato",E.relato)}</dl></div>
      <div class="bloco"><h3>Documentos que tem <button data-ir="4">corrigir</button></h3><dl><dd>${E.docs.length ? esc(E.docs.join(" · ")) : "Nenhum marcado"}</dd></dl></div>
    </div>`;
  },
  fim(){
    const a = area();
    const urg = urgente();
    const alerta = urg ? `<div class="alerta"><strong>Caso urgente:</strong> se houver risco imediato à saúde, procure atendimento médico agora e nos chame pelo WhatsApp.</div>` : "";
    if(!CONFIG.endpoint){
      // sem planilha: a ficha só chega ao escritório pela mensagem de WhatsApp
      return `<div class="cartao">${capa(true)}
      <h1>Falta só enviar</h1>
      <p class="lead">O WhatsApp abre com a sua ficha já escrita. <strong>Toque em enviar</strong> na conversa para ela chegar até nós.</p>
      <a class="btn zap" href="${linkZap(mensagemCompleta())}" target="_blank" rel="noopener">Enviar pelo WhatsApp</a>
      <p>Se o WhatsApp não abriu, toque no botão acima. Número do seu protocolo:</p>
      <div class="protocolo">${esc(E.protocolo)}</div>
      ${alerta}
    </div>`;
    }
    const msg = `Olá! Preenchi a ficha Consulta Viva.\nProtocolo: ${E.protocolo}\nNome: ${E.dados.nome}\nAssunto: ${a ? a.nome : ""}`;
    return `<div class="cartao">${capa(true)}
      <h1>Recebemos o seu caso</h1>
      <p class="lead">Guarde o número do seu protocolo:</p>
      <div class="protocolo">${esc(E.protocolo)}</div>
      <p>Vamos analisar as informações e entrar em contato pelo WhatsApp informado. Se preferir, avise agora que preencheu:</p>
      <a class="btn zap" href="${linkZap(msg)}" target="_blank" rel="noopener">Avisar pelo WhatsApp</a>
      ${alerta}
    </div>`;
  }
};

function urgente(){
  const a = area(); if(!a) return false;
  return a.perguntas.some(q => q.urgencia && E.respostas[q.id] === q.urgencia);
}

// ── coleta por etapa ────────────────────────────────────────
function coletar(nome){
  const f = $("#form");
  if(nome === "id"){
    E.dados.nome = $("#f_nome").value.trim();
    E.dados.whatsapp = $("#f_zap").value.trim();
    E.dados.email = $("#f_mail").value.trim();
    E.dados.cidade = $("#f_cid").value.trim();
    E.dados.origem = lerCampo(f.querySelector('[data-q="origem"]'));
    E.hp = $("#f_hp").value;
  }
  if(nome === "area"){
    const nova = lerCampo(f.querySelector('[data-q="area"]'));
    if(nova !== E.area){ E.respostas = {}; E.docs = []; E.consentSaude = false; }
    E.area = nova;
  }
  if(nome === "perguntas"){
    f.querySelectorAll(".campo").forEach(el => {
      const v = lerCampo(el);
      if(el.dataset.q === "__relato") E.relato = v; else E.respostas[el.dataset.q] = v;
    });
  }
  if(nome === "docs"){
    E.docs = Array.from(f.querySelectorAll("input[type=checkbox]:checked")).map(i => i.value);
  }
  if(nome === "lgpd"){
    E.consent = $("#c1").checked;
    E.consentSaude = sensivel() ? $("#c2").checked : false;
  }
}
function validarEtapa(nome){
  const f = $("#form");
  if(!f) return true;
  if(nome === "lgpd"){
    let ok = true;
    f.querySelectorAll(".campo").forEach(el => {
      const c = el.querySelector("input[type=checkbox]");
      el.classList.toggle("invalido", !c.checked);
      if(!c.checked) ok = false;
    });
    return ok;
  }
  return validar(f);
}

// ── envio ───────────────────────────────────────────────────
function linkZap(msg){ return `https://wa.me/${soDigitos(CONFIG.whatsapp)}?text=${encodeURIComponent(msg)}`; }
function mensagemCompleta(){
  const a = area(), d = E.dados, L = [];
  L.push("*FICHA DE PRÉ-ATENDIMENTO*", "Protocolo: " + E.protocolo);
  if(urgente()) L.push("⚠️ *CASO URGENTE*");
  L.push("", "*Dados*", "Nome: " + d.nome, "WhatsApp: " + d.whatsapp);
  if(d.email) L.push("E-mail: " + d.email);
  L.push("Cidade: " + d.cidade);
  if(d.origem) L.push("Como conheceu: " + d.origem);
  L.push("", "*Assunto:* " + a.nome);
  a.perguntas.forEach(q => { if(E.respostas[q.id]) L.push("• " + q.label + " " + E.respostas[q.id]); });
  if(E.relato) L.push("", "*Relato:*", E.relato);
  L.push("", "*Documentos que tem:* " + (E.docs.length ? E.docs.join(", ") : "nenhum marcado"));
  L.push("", "Autorizou o uso dos dados (LGPD): sim" + (a.sensivel ? " · dados de saúde (art. 11): " + (E.consentSaude ? "sim" : "não") : ""));
  return L.join("\n");
}
async function enviar(btn){
  btn.disabled = true; btn.textContent = "Enviando…";
  E.protocolo = E.protocolo || gerarProtocolo();
  const a = area();
  if(!CONFIG.endpoint){
    // abre o WhatsApp ainda dentro do toque, antes de qualquer await, para o navegador não bloquear
    if(!E.hp) window.open(linkZap(mensagemCompleta()), "_blank", "noopener");
    E.enviado = true; limpar();
    E.etapa = ETAPAS.indexOf("fim");
    render();
    return;
  }
  const payload = {
    protocolo: E.protocolo,
    recebidoEm: new Date().toISOString(),
    nome: E.dados.nome, whatsapp: E.dados.whatsapp, email: E.dados.email,
    cidade: E.dados.cidade, origem: E.dados.origem,
    area: a.nome, sensivel: !!a.sensivel, urgente: urgente(),
    respostas: a.perguntas.map(q => ({pergunta:q.label, resposta:E.respostas[q.id]||""})),
    documentos: E.docs, relato: E.relato,
    consentimento: E.consent, consentimentoSaude: E.consentSaude,
    _hp: E.hp
  };
  if(CONFIG.endpoint){
    try{
      // text/plain evita bloqueio de CORS no Apps Script
      await fetch(CONFIG.endpoint, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)});
      E.enviado = true;
    }catch(err){
      btn.disabled = false; btn.textContent = "Tentar de novo";
      alert("Não foi possível enviar agora. Verifique sua internet e tente de novo.");
      return;
    }
  }
  limpar();
  E.etapa = ETAPAS.indexOf("fim");
  render();
}

// ── navegação e render ──────────────────────────────────────
function ir(n){ E.etapa = n; salvar(); render(); window.scrollTo({top:0, behavior:"smooth"}); }
function avancar(){
  const nome = ETAPAS[E.etapa];
  if(nome !== "boas" && nome !== "revisao"){
    if(!validarEtapa(nome)) return;
    coletar(nome);
  }
  ir(E.etapa + 1);
}
function voltar(){
  const nome = ETAPAS[E.etapa];
  if($("#form")) coletar(nome);
  ir(Math.max(0, E.etapa - 1));
}

function render(){
  pararMic();
  const nome = ETAPAS[E.etapa];
  app.innerHTML = T[nome]();
  // progresso
  const visiveis = ETAPAS.filter(k => ROTULOS[k]);
  const i = visiveis.indexOf(nome);
  $("#progresso").hidden = i < 0;
  if(i >= 0){
    $("#trilho").style.width = ((i+1)/visiveis.length*100) + "%";
    $("#passoTxt").textContent = `Etapa ${i+1} de ${visiveis.length} · ${ROTULOS[nome]}`;
  }
  // barra de botões
  const barra = $("#barra");
  if(nome === "boas") barra.innerHTML = `<button class="btn prim" id="bAv">Começar</button>`;
  else if(nome === "revisao") barra.innerHTML = `<button class="btn sec" id="bVo">Voltar</button><button class="btn prim" id="bEnv">${CONFIG.endpoint ? "Enviar ficha" : "Enviar pelo WhatsApp"}</button>`;
  else if(nome === "fim") barra.innerHTML = `<button class="btn sec" id="bNova" style="flex:1">Preencher outra ficha</button>`;
  else barra.innerHTML = `<button class="btn sec" id="bVo">Voltar</button><button class="btn prim" id="bAv">Continuar</button>`;
  const on = (id, fn) => { const b = $(id); if(b) b.onclick = fn; };
  on("#bAv", avancar); on("#bVo", voltar);
  on("#bEnv", e => enviar(e.currentTarget));
  on("#bNova", () => { E = novoEstado(); limpar(); render(); });
  // extras
  const z = $("#f_zap"); if(z) z.addEventListener("input", () => { z.value = mascaraTel(z.value); });
  app.querySelectorAll(".mic").forEach(b => b.onclick = () => iniciarMic(b));
  app.querySelectorAll("[data-ir]").forEach(b => b.onclick = () => ir(+b.dataset.ir));
  app.querySelectorAll(".campo").forEach(el => el.addEventListener("change", () => el.classList.remove("invalido")));
  app.querySelectorAll(".campo input[type=text],.campo textarea").forEach(i => i.addEventListener("input", () => i.closest(".campo").classList.remove("invalido")));
}

// ── início ──────────────────────────────────────────────────
const c = CONFIG.cores || {};
const r = document.documentElement.style;
if(c.papel) r.setProperty("--papel", c.papel);
if(c.tinta) r.setProperty("--tinta", c.tinta);
if(c.destaque) r.setProperty("--destaque", c.destaque);
if(c.apoio) r.setProperty("--apoio", c.apoio);
if(c.claro) r.setProperty("--suaveFundo", c.claro);
const V = CONFIG.visual || {};
if(V.fonteTitulo) r.setProperty("--fonteTitulo", V.fonteTitulo);
if(V.fundo){ r.setProperty("--imgFundo", `url("${V.fundo}")`); document.body.classList.add("com-fundo"); }
if(V.logo){
  $("#topo").classList.add("com-logo");
  $("#topo").innerHTML = `<img class="logo" src="${esc(V.logo)}" alt="${esc(CONFIG.escritorio)}"><div class="nome">${esc(CONFIG.nomeTopo || CONFIG.escritorio)}</div><div class="oab">${esc(CONFIG.sociedade || CONFIG.advogado)}</div>`;
} else {
  $("#topo").innerHTML = `<div class="selo">${esc(CONFIG.iniciais)}</div><div><div class="nome">${esc(CONFIG.escritorio)}</div><div class="oab">${esc(CONFIG.advogado)}</div></div>`;
}
$("#rodape").textContent = "Consulta Viva · ficha de pré-atendimento · " + CONFIG.escritorio + (CONFIG.endereco ? " · " + CONFIG.endereco : "");
carregar();
if(E.etapa >= ETAPAS.indexOf("fim")) E.etapa = 0;
if(E.etapa >= ETAPAS.indexOf("perguntas") && !area()) E.etapa = ETAPAS.indexOf("area");
render();
})();
</script>
</body>
